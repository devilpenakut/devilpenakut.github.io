{%- assign bulan = "Januari,Februari,Maret,April,Mei,Juni,Juli,Agustus,September,Oktober,November,Desember" | split: "," -%}
{%- assign m = include.date | date: "%-m" | minus: 1 -%}
<time datetime="{{ include.date | date_to_xmlschema }}">{{ include.date | date: "%-d" }} {{ bulan[m] }} {{ include.date | date: "%Y" }}</time>
